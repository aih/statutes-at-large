[project]
name = "statutes-linkedlegislation"
version = "0.1.0"
description = "Statutes at Large and Statute Compilations, served by the identifiers the US Code cites"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lxml>=5.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "respx>=0.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: parses a whole STATUTE volume; run with `make test-slow`",
    "integration: needs the Postgres from docker compose with volumes loaded; skips when absent",
]
