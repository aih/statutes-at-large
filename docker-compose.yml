# The site: Postgres, the API, the reader, and the proxy that owns the port.
#
#   browser :8010 ── proxy ─┬── /app/*  → frontend:4321   (Astro SSR on Node)
#                           └── /*      → api:8001        (FastAPI)
#
# The reader reads the API over HTTP (API_BASE_URL) and nothing else.
#
# Host ports 5434 and 8010 rather than 5432 and 8000: the US Code site's stack
# runs on this machine with those.
#
# The project name is fixed rather than taken from the directory, so every
# checkout and worktree of the repository addresses the same containers and
# volumes: `make dev-up` from a worktree finds the running `db` (ADR-0025).
name: statutes-linkedlegislation

services:
  # The dev search cluster, on host port 9201 (9200 is the US Code site's dev
  # cluster on this machine). On the box this site joins that project's
  # cluster instead (docker-compose.prod.yml); this service exists only here.
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    environment:
      - discovery.type=single-node
      # From .env (copy .env.example). The security plugin rejects a password
      # that resembles the username, so it must not contain "admin" — the
      # container exits 1 at boot if it does, and the only sign is a line in
      # its log.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${SEARCH_PASSWORD:-}
    ports:
      - "9201:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -skf -u admin:\"$$OPENSEARCH_INITIAL_ADMIN_PASSWORD\" https://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: statutes
      POSTGRES_PASSWORD: statutes
      POSTGRES_DB: statutes
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statutes"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      # Not `service_healthy`: the healthcheck needs SEARCH_PASSWORD to pass,
      # and the stack must still come up with none set (search is then
      # unconfigured, not a reason the API refuses to start).
      opensearch:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://statutes:statutes@db:5432/statutes
      GOVINFO_API_KEY: ${GOVINFO_API_KEY:-}
      SEARCH_URL: https://opensearch:9200
      SEARCH_PASSWORD: ${SEARCH_PASSWORD:-}
      # False *only here*. The image generates a self-signed certificate at
      # first boot, so verification cannot succeed against the dev stack.
      SEARCH_VERIFY_CERTS: "false"
    expose:
      - "8001"
    volumes:
      - .:/app
    command:
      [
        "uv", "run", "python", "-m", "uvicorn",
        "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload",
        "--proxy-headers", "--forwarded-allow-ips", "*",
      ]

  frontend:
    build: ./frontend
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8001
      USCODE_ORIGIN: ${USCODE_ORIGIN:-https://uscode.linkedlegislation.org}
      HOST: 0.0.0.0
      PORT: "4321"
    expose:
      - "4321"

  proxy:
    image: caddy:2-alpine
    depends_on:
      - api
      - frontend
    ports:
      - "8010:8000"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  pgdata:
  caddydata:
  osdata:
