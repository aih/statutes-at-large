# The edge: one Caddy that terminates TLS for both hostnames on the box and
# hands each to its site's own proxy over the external `edge` network.
#
#   :443 ── caddy ─┬── uscode.linkedlegislation.org   → uscode-proxy:8000
#                  └── statutes.linkedlegislation.org → statutes-proxy:8000
#
# Brought up by deploy/edge/up.sh, which also creates the network:
#
#   docker compose -p edge -f deploy/edge/docker-compose.yml up -d --wait
#
# Ports. The host port equals the container port, and the Caddyfile's site
# addresses decide which ports Caddy listens on: bare hostnames (production)
# mean 80 and 443, so the defaults publish 80:80 and 443:443. A rehearsal sets
# plain-HTTP addresses that name a port (`http://statutes.localhost:8020`) and
# publishes it with EDGE_HTTP_PORT=8020; EDGE_HTTPS_PORT is then set to a free
# port that nothing listens on (deploy/edge/README.md).
#
# Environment (all optional):
#   USCODE_SITE_ADDRESS, STATUTES_SITE_ADDRESS   the two site addresses
#   EDGE_HTTP_PORT=80, EDGE_HTTPS_PORT=443        the ports published
#   DATA_ROOT=/var/lib/statutes                   holds edge-caddy/ (certificates)
name: edge

services:
  caddy:
    image: caddy:2-alpine
    environment:
      USCODE_SITE_ADDRESS: ${USCODE_SITE_ADDRESS:-uscode.linkedlegislation.org}
      STATUTES_SITE_ADDRESS: ${STATUTES_SITE_ADDRESS:-statutes.linkedlegislation.org}
    ports:
      - "${EDGE_HTTP_PORT:-80}:${EDGE_HTTP_PORT:-80}"
      - "${EDGE_HTTPS_PORT:-443}:${EDGE_HTTPS_PORT:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:-/var/lib/statutes}/edge-caddy:/data
    networks:
      - edge
    restart: unless-stopped
    mem_limit: 128m

networks:
  edge:
    external: true
